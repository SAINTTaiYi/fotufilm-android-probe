name: android-engine

# Builds DhaliwalX/fotufilm-engine's Android engine (libfotufilm.so, arm64-v8a) on
# an x86_64 runner. The phone cannot do it: Halide wants a from-source LLVM 21+
# and the Swift engine wants a swift.org toolchain + Swift SDK for Android, none
# of which exist for aarch64-bionic.
#
# Order is deliberate: every cheap, easy-to-get-wrong step runs before the
# expensive ones, so a bad URL costs a minute instead of an hour.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FOTUFILM_REPO: DhaliwalX/fotufilm-engine
  # The tree this probe was written against. Moving it means re-reading the
  # build scripts, not just bumping a number.
  FOTUFILM_REF: b9049f3e8897a51ab8f917edb39f023cb340d2e2
  # v22.0.0.dev0-408; tools/desktop-build-config.sh's five Vulkan patches apply
  # to this pin and nothing else.
  HALIDE_PIN: 58868f0c7106f8e1214c8ae14f55e3157659b8e0
  SWIFT_VER: 6.3.3
  SWIFT_SDK_NAME: swift-6.3.3-RELEASE_android
  # Not `android/`: that segment 404s. The SDK lives under `android-sdk/`, with
  # the release name repeated inside the path.
  SWIFT_SDK_URL: https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350          # GitHub's hard cap is 360

    steps:
      - name: machine
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          echo "NDK=$ANDROID_NDK_LATEST_HOME"; ls "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt"

      - name: checkout fotufilm at the pinned commit + Halide submodule
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FOTUFILM_REPO }}
          ref: ${{ env.FOTUFILM_REF }}
          submodules: recursive
          fetch-depth: 0
          path: src

      # --- 1. the toolchains the two halves need ---------------------------------
      - name: llvm 21, lld, vulkan headers, ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -qq
          # libvulkan-dev carries <vulkan/vulkan.h>; there is no `vulkan-headers`
          # package on jammy (that name is Fedora's) and apt-get refuses the lot.
          # liblld-21-dev is the one that is easy to miss: Halide's
          # FindHalide_LLVM looks for a WebAssembly component and only finds it
          # when LLD's CMake files are installed. Without it the configure step
          # dies with "liblld is missing", which reads like an LLVM problem.
          sudo apt-get install -y -qq \
            llvm-21-dev liblld-21-dev lld-21 clang-21 libclang-21-dev \
            libzstd-dev zlib1g-dev libvulkan-dev \
            cmake ninja-build pkg-config nasm yasm autoconf automake libtool \
            libxml2-dev libffi-dev libedit-dev libncurses-dev libsqlite3-dev \
            libcurl4-openssl-dev libdigest-sha-perl zip
          echo "LLVM_ROOT=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          "/usr/lib/llvm-21/bin/llvm-config" --version
          ls /usr/lib/llvm-21/lib/cmake/ | tr '\n' ' '

      - name: swift 6.3.3 toolchain
        run: |
          cd "$RUNNER_TEMP"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors -o swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VER}-release/ubuntu2204/swift-${SWIFT_VER}-RELEASE/swift-${SWIFT_VER}-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p swift && tar xzf swift.tar.gz -C swift --strip-components=1
          echo "SWIFT_TOOLCHAIN=$RUNNER_TEMP/swift" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swift/usr/bin/swift" --version

      - name: cache the swift android sdk
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm/swift-sdks
          key: swift-android-sdk-${{ env.SWIFT_VER }}-v1

      # The tarball's top level is exactly `$SWIFT_SDK_NAME.artifactbundle/`, so
      # extracting into ~/.swiftpm/swift-sdks lands on the path
      # tools/build-android-engine.sh reads. No `swift sdk install` — it goes
      # through the CDN redirect and is unreliable in CI.
      - name: swift sdk for android
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.swiftpm/swift-sdks"
          cd "$RUNNER_TEMP"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors -o sdk.tar.gz "$SWIFT_SDK_URL"
          ls -l sdk.tar.gz
          tar xzf sdk.tar.gz -C "$HOME/.swiftpm/swift-sdks"
          ls -d "$HOME/.swiftpm/swift-sdks/"*.artifactbundle

      - name: prove the sdk is where the build script looks
        run: |
          B="$HOME/.swiftpm/swift-sdks/$SWIFT_SDK_NAME.artifactbundle/swift-android"
          test -d "$B" || { echo "no bundle at $B"; ls -R "$HOME/.swiftpm/swift-sdks" | head -40; exit 1; }
          test -f "$B/scripts/setup-android-sdk.sh" || { echo "no setup script"; exit 1; }
          test -f "$B/swift-resources/usr/lib/swift-aarch64/android/aarch64/swiftrt.o" \
            || { echo "no swiftrt.o"; find "$B" -name swiftrt.o | head; exit 1; }
          echo "SWIFT_SDK=$SWIFT_SDK_NAME" >> "$GITHUB_ENV"
          echo ok

      # --- 2. the expensive halves, both cached ----------------------------------
      - name: cache halide
        id: halide-cache
        uses: actions/cache@v4
        with:
          path: src/build/halide-linux-install
          key: halide-${{ env.HALIDE_PIN }}-llvm21-v1

      - name: halide (pinned + the five vulkan patches)
        if: steps.halide-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          git submodule update --init third_party/Halide
          tools/build-halide-linux.sh
          echo "HALIDE_ROOT=$PWD/build/halide-linux-install" >> "$GITHUB_ENV"

      - name: halide root from cache
        if: steps.halide-cache.outputs.cache-hit == 'true'
        run: |
          echo "HALIDE_ROOT=$GITHUB_WORKSPACE/src/build/halide-linux-install" >> "$GITHUB_ENV"
          ls "$GITHUB_WORKSPACE/src/build/halide-linux-install/lib" | head

      - name: cache halide android kernels
        id: kernels-cache
        uses: actions/cache@v4
        with:
          path: src/build/halide-android-arm64
          key: halide-android-${{ env.HALIDE_PIN }}-v1

      - name: android aot kernels (arm64 + vulkan)
        working-directory: src
        run: |
          tools/generate-halide-aot-android.sh
          ls -l build/halide-android-arm64/*.a | head

      # The Vulkan half is the only developer the upstream Android build links,
      # and `FotufilmHalideLinux.cpp` hardcodes `fotufilm_halide_available()` to
      # 0 because of it. If a driver refuses Halide's compute pipelines there is
      # then nothing to fall back to. So this adds the CPU half as well:
      #  * the ARM64 CPU kernels (generate_halide_android.cpp, --no-runtime so it
      #    shares the Vulkan build's Halide runtime instead of clashing with it),
      #    generated into the same directory so build-android-engine.sh's
      #    "$KERNELS"/*.a picks them up;
      #  * FotufilmHalideAndroid.cpp compiled beside the Linux shim, with the two
      #    symbols both define renamed out of the way;
      #  * and the GPU shim's `available` flipped to 1, which is what makes
      #    HostEngine choose HalideCPUDeveloper when FOTUFILM_GPU_DEVICE=cpu.
      - name: android cpu kernels + a developer that needs no GPU
        working-directory: src
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I"$HALIDE_ROOT/include" -ISources/FotufilmHalide/include \
            tools/generate_halide_android.cpp \
            -L"$HALIDE_ROOT/lib" -lHalide -Wl,-rpath,"$HALIDE_ROOT/lib" \
            -o build/generate-android-cpu
          build/generate-android-cpu build/halide-android-arm64 --no-runtime
          ls -l build/halide-android-arm64/*.a

          # Three edits, and not one backslash in them: a continuation that goes
          # through a heredoc and a python string literal is one escaping layer
          # too many. The commands below are one line each for that reason.
          python3 - <<'PY2'
          import io

          # 1. The GPU shim stops claiming there is no Halide at all, which is
          #    what makes HostEngine willing to build the CPU developer.
          p = 'Sources/FotufilmHalide/FotufilmHalideLinux.cpp'
          s = io.open(p, encoding='utf-8').read()
          old = 'extern "C" int32_t fotufilm_halide_available(void) { return 0; }'
          new = 'extern "C" int32_t fotufilm_halide_available(void) { return 1; }'
          assert s.count(old) == 1, ('available', s.count(old))
          io.open(p, 'w', encoding='utf-8').write(s.replace(old, new))

          # 2. The build compiles the CPU shim too. The two symbols it shares
          #    with the Linux shim are renamed so both can live in one .so.
          p = 'tools/build-android-engine.sh'
          s = io.open(p, encoding='utf-8').read()
          anchor = '  Sources/FotufilmHalide/FotufilmHalideLinux.cpp -o "$OBJ/FotufilmHalideLinux.o"'
          assert s.count(anchor) == 1, ('anchor', s.count(anchor))
          cmd = ('"$CXX" -std=c++17 "${CFLAGS_COMMON[@]}" -c -DFOTUFILM_HALIDE_ANDROID_AOT=1 '
                 '-Dfotufilm_halide_available=fotufilm_halide_available_cpu '
                 '-Dfotufilm_halide_set_film_tiles=fotufilm_halide_set_film_tiles_cpu '
                 '-I"$KERNELS" -ISources/FotufilmHalide/include -ISources/FotufilmHalide '
                 'Sources/FotufilmHalide/FotufilmHalideAndroid.cpp -o "$OBJ/FotufilmHalideAndroid.o"')
          note = ('# The CPU developer: the same Halide runtime, kernels compiled for ARM64'
                  + chr(10) + '# with no device at all.' + chr(10))
          s = s.replace(anchor, anchor + chr(10) + note + cmd)

          # 3. And links it.
          link = '  "$OBJ/FotufilmHost.o" "$OBJ/FotufilmHalideLinux.o"'
          assert s.count(link) == 1, ('link', s.count(link))
          s = s.replace(link, link + ' "$OBJ/FotufilmHalideAndroid.o"')
          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched')
          PY2

      # --- 3. the codecs --------------------------------------------------------
      # FFmpeg is not optional here even though this probe only wants photos:
      # every file in Sources/CFotufilmVideo is wrapped in
      # `#if __has_include(<libavformat/avformat.h>)` with no #else, so without
      # its headers ffv_available / ffv_last_error / ffv_free are never defined
      # -- and Sources/FotufilmHost/HostVideo+FFmpeg.swift still calls them,
      # because fotufilm_video.h includes nothing but stddef/stdint and so
      # canImport(CFotufilmVideo) is true. The shared object links anyway
      # (undefined symbols are legal in a .so) and then fails to dlopen.
      # So: build it, and cache the result.
      - name: cache android codecs
        id: codecs-cache
        uses: actions/cache@v4
        with:
          path: src/build/android-deps
          key: android-deps-v1

      - name: android codecs + ffmpeg
        if: steps.codecs-cache.outputs.cache-hit != 'true'
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/src/build/android-deps
        run: |
          tools/build-android-codecs.sh
          ls -l build/android-deps/arm64/lib | head -24

      # --- 4. the engine --------------------------------------------------------
      - name: libfotufilm.so
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/src/build/android-deps
        run: |
          tools/build-android-engine.sh
          echo "--- jniLibs ---"
          ls -l flutter/build/android-engine/jniLibs/arm64-v8a/
          echo "--- assets ---"
          ls flutter/build/android-engine/assets/fotufilm | head -12
          test -f flutter/build/android-engine/jniLibs/arm64-v8a/libfotufilm.so \
            || { echo "no libfotufilm.so"; exit 1; }
          du -sh flutter/build/android-engine

      # --- 5. ship it -----------------------------------------------------------
      - name: collect
        run: |
          mkdir -p out
          cp -a src/flutter/build/android-engine/jniLibs out/
          cp -a src/flutter/build/android-engine/assets out/
          mkdir -p out/include
          cp src/Sources/CFotufilmHost/include/fotufilm.h out/include/
          # What the shim was built against, so the shell can be matched to it.
          { echo "fotufilm ref: $FOTUFILM_REF"
            echo "halide pin:   $HALIDE_PIN"
            echo "llvm:         $(/usr/lib/llvm-21/bin/llvm-config --version)"
            echo "swift:        $("$SWIFT_TOOLCHAIN/usr/bin/swift" --version 2>&1 | head -2)"
            echo "ndk:          $ANDROID_NDK_LATEST_HOME"
            echo "built:        $(date -u +%FT%TZ)"
          } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt
          du -sh out; find out -name '*.so' -exec ls -l {} \;
          cd out && zip -qry ../fotufilm-android-engine.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: fotufilm-android-engine
          path: fotufilm-android-engine.zip
          retention-days: 30
