name: android-engine

# Builds DhaliwalX/fotufilm-engine's Android engine (libfotufilm.so, arm64-v8a) on
# an x86_64 runner. The phone cannot do it: Halide wants a from-source LLVM 21+
# and the Swift engine wants a swift.org toolchain + Swift SDK for Android, none
# of which exist for aarch64-bionic.
#
# Order is deliberate: every cheap, easy-to-get-wrong step runs before the
# expensive ones, so a bad URL costs a minute instead of an hour.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FOTUFILM_REPO: DhaliwalX/fotufilm-engine
  # The tree this probe was written against. Moving it means re-reading the
  # build scripts, not just bumping a number.
  FOTUFILM_REF: b9049f3e8897a51ab8f917edb39f023cb340d2e2
  # v22.0.0.dev0-408; tools/desktop-build-config.sh's five Vulkan patches apply
  # to this pin and nothing else.
  HALIDE_PIN: 58868f0c7106f8e1214c8ae14f55e3157659b8e0
  SWIFT_VER: 6.3.3
  SWIFT_SDK_NAME: swift-6.3.3-RELEASE_android
  # Not `android/`: that segment 404s. The SDK lives under `android-sdk/`, with
  # the release name repeated inside the path.
  SWIFT_SDK_URL: https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350          # GitHub's hard cap is 360

    steps:
      - name: machine
        run: |
          nproc; free -g | head -2; df -h / | tail -1
          echo "NDK=$ANDROID_NDK_LATEST_HOME"; ls "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt"

      # Our own tree, for patches/. The step below checks out *another* repository into
      # `src`, so without this one the workspace holds nothing of ours.
      - name: checkout this probe
        uses: actions/checkout@v4
        with:
          path: probe

      - name: checkout fotufilm at the pinned commit + Halide submodule
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FOTUFILM_REPO }}
          ref: ${{ env.FOTUFILM_REF }}
          submodules: recursive
          fetch-depth: 0
          path: src

      # --- 1a. the bake hook -----------------------------------------------------
      # One header and four edits across the two shims, applied before anything is
      # compiled so a typo costs seconds instead of an hour. The hook writes a
      # frame's packed configuration, the three spectral tables, its input and its
      # output to FOTUFILM_BAKE_DIR; with that variable unset it costs one getenv
      # per develop. FotufilmHalideAndroid.cpp is the developer that actually runs
      # (the job below builds it beside the Linux shim); the Linux one is hooked
      # too so a driver that accepts Halide's compute pipelines dumps the same.
      - name: bake dump hook
        run: |
          cp "$GITHUB_WORKSPACE/probe/patches/FotufilmBakeDump.h" src/Sources/FotufilmHalide/
          python3 "$GITHUB_WORKSPACE/probe/patches/apply_swift_physics_dump.py" \
            src/Sources/FotufilmCore/FilmEngine.swift
          python3 "$GITHUB_WORKSPACE/probe/patches/apply_spectral_probe.py" \
            src/Sources/FotufilmCore/SpectralModel.swift
          python3 "$GITHUB_WORKSPACE/probe/patches/apply_bake_hook.py" src
          echo "--- the hook, as it landed ---"
          grep -n "FotufilmBakeDump.h\|bake::dump_planar\|bake::dump_frame\|bake::dump_tiles" \
            src/Sources/FotufilmHalide/FotufilmHalideAndroid.cpp \
            src/Sources/FotufilmHalide/FotufilmHalideLinux.cpp

      # --- 1. the toolchains the two halves need ---------------------------------
      - name: llvm 21, lld, vulkan headers, ninja
        run: |
          # The runner's stock mirror (azure.archive.ubuntu.com) has been failing to resolve
          # for hours at a time; the archive name itself answers, and a retry rides out a
          # single blip instead of costing fifteen minutes.
          sudo grep -rl "azure.archive.ubuntu.com" /etc/apt/ \
            | sudo xargs -r sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' || true
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -qq -o Acquire::Retries=10
          # libvulkan-dev carries <vulkan/vulkan.h>; there is no `vulkan-headers`
          # package on jammy (that name is Fedora's) and apt-get refuses the lot.
          # liblld-21-dev is the one that is easy to miss: Halide's
          # FindHalide_LLVM looks for a WebAssembly component and only finds it
          # when LLD's CMake files are installed. Without it the configure step
          # dies with "liblld is missing", which reads like an LLVM problem.
          sudo apt-get install -y -qq -o Acquire::Retries=10 \
            llvm-21-dev liblld-21-dev lld-21 clang-21 libclang-21-dev \
            libzstd-dev zlib1g-dev libvulkan-dev \
            cmake ninja-build pkg-config nasm yasm autoconf automake libtool \
            libxml2-dev libffi-dev libedit-dev libncurses-dev libsqlite3-dev \
            libcurl4-openssl-dev libdigest-sha-perl zip
          echo "LLVM_ROOT=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          "/usr/lib/llvm-21/bin/llvm-config" --version
          ls /usr/lib/llvm-21/lib/cmake/ | tr '\n' ' '

      - name: swift 6.3.3 toolchain
        run: |
          cd "$RUNNER_TEMP"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors -o swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VER}-release/ubuntu2204/swift-${SWIFT_VER}-RELEASE/swift-${SWIFT_VER}-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p swift && tar xzf swift.tar.gz -C swift --strip-components=1
          echo "SWIFT_TOOLCHAIN=$RUNNER_TEMP/swift" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swift/usr/bin/swift" --version

      - name: cache the swift android sdk
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.swiftpm/swift-sdks
          key: swift-android-sdk-${{ env.SWIFT_VER }}-v1

      # The tarball's top level is exactly `$SWIFT_SDK_NAME.artifactbundle/`, so
      # extracting into ~/.swiftpm/swift-sdks lands on the path
      # tools/build-android-engine.sh reads. No `swift sdk install` — it goes
      # through the CDN redirect and is unreliable in CI.
      - name: swift sdk for android
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.swiftpm/swift-sdks"
          cd "$RUNNER_TEMP"
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors -o sdk.tar.gz "$SWIFT_SDK_URL"
          ls -l sdk.tar.gz
          tar xzf sdk.tar.gz -C "$HOME/.swiftpm/swift-sdks"
          ls -d "$HOME/.swiftpm/swift-sdks/"*.artifactbundle

      - name: prove the sdk is where the build script looks
        run: |
          B="$HOME/.swiftpm/swift-sdks/$SWIFT_SDK_NAME.artifactbundle/swift-android"
          test -d "$B" || { echo "no bundle at $B"; ls -R "$HOME/.swiftpm/swift-sdks" | head -40; exit 1; }
          test -f "$B/scripts/setup-android-sdk.sh" || { echo "no setup script"; exit 1; }
          test -f "$B/swift-resources/usr/lib/swift-aarch64/android/aarch64/swiftrt.o" \
            || { echo "no swiftrt.o"; find "$B" -name swiftrt.o | head; exit 1; }
          echo "SWIFT_SDK=$SWIFT_SDK_NAME" >> "$GITHUB_ENV"
          echo ok

      # --- 2. the expensive halves, both cached ----------------------------------
      - name: cache halide
        id: halide-cache
        uses: actions/cache@v4
        with:
          path: src/build/halide-linux-install
          key: halide-${{ env.HALIDE_PIN }}-llvm21-v1

      - name: halide (pinned + the five vulkan patches)
        if: steps.halide-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          git submodule update --init third_party/Halide
          tools/build-halide-linux.sh
          echo "HALIDE_ROOT=$PWD/build/halide-linux-install" >> "$GITHUB_ENV"

      - name: halide root from cache
        if: steps.halide-cache.outputs.cache-hit == 'true'
        run: |
          echo "HALIDE_ROOT=$GITHUB_WORKSPACE/src/build/halide-linux-install" >> "$GITHUB_ENV"
          ls "$GITHUB_WORKSPACE/src/build/halide-linux-install/lib" | head

      - name: cache halide android kernels
        id: kernels-cache
        uses: actions/cache@v4
        with:
          path: src/build/halide-android-arm64
          # v2: v1 is full of the 2864 per-variant Vulkan kernels that the next
          # step no longer builds, and a hit restores them into the link.
          key: halide-android-${{ env.HALIDE_PIN }}-v2-cpuonly

      - name: android aot kernels (arm64, no per-variant Vulkan)
        working-directory: src
        run: |
          set -euo pipefail
          # **The 2864 Vulkan variants are not built, and nothing references them.**
          #
          # `generate-halide-aot-android.sh` asks the generator for a count and
          # then emits one variant per stock per stage, each statically carrying
          # its own SPIR-V. Measured on the 154 MB library: .rodata is 123.3 MB
          # and holds exactly 2864 embedded SPIR-V modules, 59% of it zero
          # padding. `.text` is only 22 MB. But `fotufilm_halide_android_gpu_*`
          # is referenced by nothing: the Vulkan shim reaches Halide through its
          # own device interface, and the developer that actually runs is the CPU
          # one (FOTUFILM_GPU_DEVICE=cpu, because the driver refuses Halide's
          # compute pipelines). The CPU kernels are general -- one per stage, not
          # one per stock -- so skipping the variants costs no picture.
          #
          # The `--extras` call stays: it is what produces the shared Halide
          # runtime and the cpu extras (negative, scan_prepare, transport,
          # trichromatic) the CPU developer links against.
          HALIDE="${HALIDE_ROOT:?set HALIDE_ROOT}"
          OUT=build/halide-android-arm64
          # **The cache step above restores the previous kernels**, and the
          # previous set is the 2864 Vulkan variants this step no longer builds.
          # The first attempt at this change shrank the artifact by 245 bytes
          # for exactly that reason: `"$KERNELS"/*.a` globbed them back in. The
          # key is bumped too, but a cleared directory is what actually holds.
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "${CXX:-clang++}" -std=c++17 -O2 -I"$HALIDE/include" -ISources/FotufilmHalide/include \
            tools/generate_halide_ios.cpp -L"$HALIDE/lib" -lHalide \
            -Wl,-rpath,"$HALIDE/lib" -lpthread -o "$OUT/generate-halide-aot"
          "$OUT/generate-halide-aot" "$OUT" --android-vulkan --prefix=fotufilm_aot_ --extras
          cp "$HALIDE/include/HalideBuffer.h" "$HALIDE/include/HalideRuntime.h" \
             "$HALIDE/include/HalideRuntimeVulkan.h" "$OUT/"
          ls -l "$OUT"/*.a

          # **The line below is what defeated the previous attempt.**
          #
          # tools/build-android-engine.sh does:
          #     if [[ -n "${HALIDE_ROOT:-}" || ! -f "$KERNELS/fotufilm_aot_runtime.a" ]]; then
          #       tools/generate-halide-aot-android.sh "$KERNELS"
          # and HALIDE_ROOT is always set in CI, so that branch always fires and
          # rebuilds all 2864 per-variant Vulkan kernels right after this step
          # deliberately skipped them. The link then globs "$KERNELS"/*.a and
          # picks every one of them back up: the .so came out byte-for-byte the
          # same size (154,434,088) across the change, which is how it was found.
          #
          # The kernels are generated above, so the fallback is only needed when
          # they are genuinely absent.
          python3 - <<'PY3'
          import io
          p = 'tools/build-android-engine.sh'
          s = io.open(p, encoding='utf-8').read()
          old = 'if [[ -n "${HALIDE_ROOT:-}" || ! -f "$KERNELS/fotufilm_aot_runtime.a" ]]; then'
          assert s.count(old) == 1, ('kernels-guard', s.count(old))
          s = s.replace(old, 'if [[ ! -f "$KERNELS/fotufilm_aot_runtime.a" ]]; then')
          io.open(p, 'w', encoding='utf-8').write(s)
          print('build-android-engine.sh: the kernel fallback no longer fires when HALIDE_ROOT is set')
          PY3

      # The Vulkan half is the only developer the upstream Android build links,
      # and `FotufilmHalideLinux.cpp` hardcodes `fotufilm_halide_available()` to
      # 0 because of it. If a driver refuses Halide's compute pipelines there is
      # then nothing to fall back to. So this adds the CPU half as well:
      #  * the ARM64 CPU kernels (generate_halide_android.cpp, --no-runtime so it
      #    shares the Vulkan build's Halide runtime instead of clashing with it),
      #    generated into the same directory so build-android-engine.sh's
      #    "$KERNELS"/*.a picks them up;
      #  * FotufilmHalideAndroid.cpp compiled beside the Linux shim, with the two
      #    symbols both define renamed out of the way;
      #  * and the GPU shim's `available` flipped to 1, which is what makes
      #    HostEngine choose HalideCPUDeveloper when FOTUFILM_GPU_DEVICE=cpu.
      - name: android cpu kernels + the CPU developer beside Vulkan
        working-directory: src
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I"$HALIDE_ROOT/include" -ISources/FotufilmHalide/include \
            tools/generate_halide_android.cpp \
            -L"$HALIDE_ROOT/lib" -lHalide -Wl,-rpath,"$HALIDE_ROOT/lib" \
            -o build/generate-android-cpu
          build/generate-android-cpu build/halide-android-arm64 --no-runtime
          ls -l build/halide-android-arm64/*.a

          # One .so, two developers.
          #
          # FotufilmHalideLinux.cpp is not a GPU-only translation unit: it also
          # defines the cpu entry points (fotufilm_halide_process and friends),
          # implemented through whatever device it picked. So the two shims
          # collide on nine names. The way out is not to drop one: rename the
          # nine in the Linux shim, compile FotufilmHalideAndroid.cpp under their
          # real names beside it, and let the link resolve those to the CPU
          # implementations. The Vulkan ones stay in the file as dead code, which
          # is 200 KB nobody pays for.
          #
          # With that, FOTUFILM_GPU_DEVICE=cpu gives HalideCPUDeveloper a working
          # fotufilm_halide_process, and the app can fall back at run time.
          python3 - <<'PY2'
          import io

          names = ['fotufilm_halide_available', 'fotufilm_halide_set_film_tiles',
                   'fotufilm_halide_develop', 'fotufilm_halide_print',
                   'fotufilm_halide_process', 'fotufilm_halide_process_strip',
                   'fotufilm_halide_process_tile', 'fotufilm_halide_process_tile_with_exposure',
                   'fotufilm_halide_process_region']
          renames = ' '.join('-D' + n + '=' + n + '_gpu' for n in names)

          p = 'tools/build-android-engine.sh'
          s = io.open(p, encoding='utf-8').read()

          # 1. the Linux shim is compiled with those nine renamed
          anchor = '  Sources/FotufilmHalide/FotufilmHalideLinux.cpp -o "$OBJ/FotufilmHalideLinux.o"'
          assert s.count(anchor) == 1, ('anchor', s.count(anchor))
          s = s.replace(anchor,
                        '  -DFOTUFILM_HALIDE_ANDROID_AOT=1 ' + renames + ' ' +
                        anchor.lstrip() + chr(10))

          # 2. and the CPU shim is compiled under their real names, beside it
          cmd = ('"$CXX" -std=c++17 "${CFLAGS_COMMON[@]}" -c -DFOTUFILM_HALIDE_ANDROID_AOT=1 '
                 '-I"$KERNELS" -ISources/FotufilmHalide/include -ISources/FotufilmHalide '
                 'Sources/FotufilmHalide/FotufilmHalideAndroid.cpp -o "$OBJ/FotufilmHalideAndroid.o"')
          tail = 'Sources/FotufilmHalide/FotufilmHalideLinux.cpp -o "$OBJ/FotufilmHalideLinux.o"'
          at = s.index(tail) + len(tail)
          note = (chr(10) + '# The CPU developer, under the real names the Linux shim gave up.' + chr(10))

          # 3. the Vulkan variants this build does not generate, as stubs: their
          #    addresses sit in a static table, and Android's linker resolves those
          #    relocations when the library opens. Without them the .so links and
          #    then refuses to load ("cannot locate symbol fotufilm_aot_vulkan_color").
          compile_stubs = (
              '"$CXX" -std=c++17 "${CFLAGS_COMMON[@]}" -c -DFOTUFILM_VULKAN_STUBS=1 '
              '-I"$KERNELS" -ISources/FotufilmHalide/include -ISources/FotufilmHalide '
              '"$GITHUB_WORKSPACE/probe/patches/vulkan_variant_stubs.cpp" '
              '-o "$OBJ/VulkanVariantStubs.o"')
          s = s[:at] + note + cmd + chr(10) + compile_stubs + s[at:]

          # 4. linked. The link line is found, not retyped: this tree spells its
          #    names Fotufilm…, and a single wrong letter here fails the build with
          #    an assertion that says nothing about spelling.
          lines = s.split(chr(10))
          at_link = next(i for i, line in enumerate(lines)
                         if 'Host.o' in line and 'HalideLinux.o' in line
                         and '"$OBJ"/codecs-*.o' in line)
          assert 'HalideAndroid.o' not in lines[at_link], 'already linked'
          lines[at_link] = lines[at_link].replace(
              '"$OBJ"/codecs-*.o',
              '"$OBJ/FotufilmHalideAndroid.o" "$OBJ/VulkanVariantStubs.o" "$OBJ"/codecs-*.o', 1)
          assert 'VulkanVariantStubs.o' in lines[at_link], 'link edit did not land'
          s = chr(10).join(lines)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched')
          PY2

      # --- 3. the codecs --------------------------------------------------------
      # FFmpeg is not optional here even though this probe only wants photos:
      # every file in Sources/CFotufilmVideo is wrapped in
      # `#if __has_include(<libavformat/avformat.h>)` with no #else, so without
      # its headers ffv_available / ffv_last_error / ffv_free are never defined
      # -- and Sources/FotufilmHost/HostVideo+FFmpeg.swift still calls them,
      # because fotufilm_video.h includes nothing but stddef/stdint and so
      # canImport(CFotufilmVideo) is true. The shared object links anyway
      # (undefined symbols are legal in a .so) and then fails to dlopen.
      # So: build it, and cache the result.
      - name: cache android codecs
        id: codecs-cache
        uses: actions/cache@v4
        with:
          path: src/build/android-deps
          key: android-deps-v1

      - name: android codecs + ffmpeg
        if: steps.codecs-cache.outputs.cache-hit != 'true'
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/src/build/android-deps
        run: |
          tools/build-android-codecs.sh
          ls -l build/android-deps/arm64/lib | head -24

      # --- 4. the engine --------------------------------------------------------
      - name: libfotufilm.so
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/src/build/android-deps
        run: |
          tools/build-android-engine.sh
          echo "--- jniLibs ---"
          ls -l flutter/build/android-engine/jniLibs/arm64-v8a/
          echo "--- assets ---"
          ls flutter/build/android-engine/assets/fotufilm | head -12
          test -f flutter/build/android-engine/jniLibs/arm64-v8a/libfotufilm.so \
            || { echo "no libfotufilm.so"; exit 1; }
          du -sh flutter/build/android-engine

      # --- 5. ship it -----------------------------------------------------------
      - name: collect
        run: |
          mkdir -p out
          cp -a src/flutter/build/android-engine/jniLibs out/
          cp -a src/flutter/build/android-engine/assets out/
          mkdir -p out/include
          cp src/Sources/CFotufilmHost/include/fotufilm.h out/include/
          # The still-image codecs as objects, with their C header: a C++ host decodes
          # through exactly the libraries the engine does, so the scene it hands the
          # kernels is the engine's own, not a re-derivation of it.
          mkdir -p out/codecs
          cp src/build/android-engine/obj/codecs-*.o out/codecs/
          cp src/Sources/CFotufilmCodecs/include/fotufilm_codecs.h out/include/
          ls -l out/codecs
          # And as one shared object, so a host links one file rather than seven
          # third-party archives in the right order. Same objects the engine uses,
          # so a decode is the engine's decode -- lcms2 through D50, not a matrix
          # of our own that lands 3e-5 away from it.
          ndk_cxx="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          ndk_bin="$(dirname "$ndk_cxx")"
          # The engine compiles the codecs with -fvisibility=hidden and links them into
          # a library that exports sixteen symbols. A host needs the codecs' own entry
          # points, and nothing short of compiling them visible makes the linker keep
          # them in the dynamic table -- -u, --export-dynamic-symbol and objcopy all
          # left them LOCAL HIDDEN. Thirteen translation units, once per build.
          mkdir -p out/codecs-visible
          for f in src/Sources/CFotufilmCodecs/*.cpp; do
            "$ndk_cxx" -std=c++17 -O2 -fPIC -fvisibility=default -fvisibility-inlines-hidden \
              -ffunction-sections -fdata-sections \
              -Isrc/Sources/CFotufilmCodecs/include -Isrc/build/android-deps/arm64/include \
              -c "$f" -o "out/codecs-visible/$(basename "$f" .cpp).o"
          done
          "$ndk_cxx" -shared -o out/libfotufilmcodecs.so \
            -Wl,-soname,libfotufilmcodecs.so \
            -Wl,--start-group out/codecs-visible/*.o \
              src/build/android-deps/arm64/lib/*.a -Wl,--end-group \
            -lz -lm -llog -ldl
          echo "--- exported ffc symbols ---"
          readelf --dyn-syms -W out/libfotufilmcodecs.so | grep -c 'ffc_' || true
          ls -l out/libfotufilmcodecs.so
          # What a C++ host needs to run the same kernels without the Swift runtime:
          # the AOT kernels, their generated headers, and the shim that calls them.
          # `FotofilmHalideAndroid.cpp` is the CPU developer the app actually runs.
          mkdir -p out/kernels
          cp src/build/halide-android-arm64/*.a src/build/halide-android-arm64/*.h out/kernels/
          cp -a src/Sources/FotufilmHalide out/engine
          du -sh out/kernels out/engine
          # Nothing the kernels must supply may be left undefined: a shared object
          # links anyway, and the phone then refuses to open it.
          echo "--- undefined aot symbols (must be none) ---"
          if readelf -sW out/jniLibs/arm64-v8a/libfotufilm.so | awk '$7 == "UND" { print $8 }' | grep fotufilm_aot_; then
            echo "error: the library would not load"; exit 1
          fi
          echo none
          # What the shim was built against, so the shell can be matched to it.
          { echo "fotufilm ref: $FOTUFILM_REF"
            echo "halide pin:   $HALIDE_PIN"
            echo "llvm:         $(/usr/lib/llvm-21/bin/llvm-config --version)"
            echo "swift:        $("$SWIFT_TOOLCHAIN/usr/bin/swift" --version 2>&1 | head -2)"
            echo "ndk:          $ANDROID_NDK_LATEST_HOME"
            echo "built:        $(date -u +%FT%TZ)"
          } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt
          du -sh out; find out -name '*.so' -exec ls -l {} \;
          cd out && zip -qry ../fotufilm-android-engine.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: fotufilm-android-engine
          path: fotufilm-android-engine.zip
          retention-days: 30
