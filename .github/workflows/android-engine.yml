name: android-engine

# Builds DhaliwalX/fotufilm-engine's Android Vulkan engine (libfotufilm.so, arm64-v8a)
# on an x86_64 runner, because the phone cannot build it: Halide needs a from-source
# LLVM 21+ and the Swift engine is cross-compiled.
#
# Order matters: everything cheap and fallible (Swift downloads) runs before the hour-long
# Halide build, so a wrong URL costs three minutes rather than forty-five.
#
# Nothing from their tree is redistributed here -- the job checks out a pinned commit
# and uploads only the built artefacts.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FOTUFILM_REF: b9049f3e8897a51ab8f917edb39f023cb340d2e2
  FOTUFILM_REPO: DhaliwalX/fotufilm-engine
  SWIFT_VER: 6.3.3
  SWIFT_SDK_NAME: swift-6.3.3-RELEASE_android

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: checkout fotufilm at the pinned commit, with the Halide submodule
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FOTUFILM_REPO }}
          ref: ${{ env.FOTUFILM_REF }}
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: probe
        run: |
          echo "--- halide pin ---"
          git -C src ls-tree HEAD third_party/Halide
          git -C src submodule status --recursive || true
          echo "--- ndk ---"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt" 2>/dev/null || true
          echo "--- swift sdk names on the mirror (if it lists) ---"
          curl -sS --max-time 20 "https://download.swift.org/swift-${SWIFT_VER}-release/android/" | head -40 || true

      - name: swift toolchain
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VER}-release/ubuntu2204/swift-${SWIFT_VER}-RELEASE/swift-${SWIFT_VER}-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p swift
          tar xzf swift.tar.gz -C swift --strip-components=1
          echo "SWIFT_TOOLCHAIN=$RUNNER_TEMP/swift" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swift/usr/bin/swift" --version

      - name: swift SDK for android (first candidate that answers)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          BASE="https://download.swift.org/swift-${SWIFT_VER}-release"
          CANDIDATES="
          $BASE/android/swift-${SWIFT_VER}-RELEASE_android.artifactbundle.tar.gz
          $BASE/android/${SWIFT_VER}-RELEASE/swift-${SWIFT_VER}-RELEASE_android.artifactbundle.tar.gz
          $BASE/android/swift-${SWIFT_VER}-RELEASE-android.artifactbundle.tar.gz
          https://github.com/swiftlang/swift-android-sdk/releases/download/${SWIFT_VER}/swift-${SWIFT_VER}-RELEASE_android.artifactbundle.tar.gz
          "
          GOT=""
          for u in $CANDIDATES; do
            code=$(curl -sSL -o android-sdk.tar.gz -w '%{http_code}' --max-time 600 "$u" || true)
            echo "$code  $u"
            if [ "$code" = "200" ]; then GOT="$u"; break; fi
          done
          [ -n "$GOT" ] || { echo "::error::no Swift SDK for Android downloaded -- fix the candidate list"; exit 1; }
          mkdir -p "$HOME/.swiftpm/swift-sdks"
          tar xzf android-sdk.tar.gz -C "$HOME/.swiftpm/swift-sdks"
          ls -d "$HOME"/.swiftpm/swift-sdks/* | head
          # the build script looks for exactly this directory name
          D=$(ls -d "$HOME"/.swiftpm/swift-sdks/* | head -1)
          T="$HOME/.swiftpm/swift-sdks/${SWIFT_SDK_NAME}.artifactbundle"
          [ "$(basename "$D")" = "$(basename "$T")" ] || mv "$D" "$T"
          ls -d "$T"/* | head
          export PATH="$SWIFT_TOOLCHAIN/usr/bin:$PATH"
          swift sdk list || true

      - name: llvm 21, clang, lld, vulkan headers, ninja
        run: |
          set -x
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-21-dev clang-21 lld-21 libclang-21-dev \
            libzstd-dev zlib1g-dev libvulkan-dev cmake ninja-build
          /usr/lib/llvm-21/bin/llvm-config --version
          echo "LLVM_ROOT=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "LLD_ROOT=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: cache halide
        id: halide-cache
        uses: actions/cache@v4
        with:
          path: src/build/halide-linux-install
          key: halide-${{ env.FOTUFILM_REF }}-llvm21-v1

      - name: halide, pinned + the five vulkan patches
        if: steps.halide-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          # reads the pin from git, applies strict-float / bool-uniforms /
          # allocation-padding / readback-staging / runtime-prefix-map
          bash tools/build-halide-linux.sh

      - name: android AOT kernels (arm64, vulkan)
        working-directory: src
        env:
          HALIDE_ROOT: ${{ github.workspace }}/src/build/halide-linux-install
          FOTUFILM_AOT_JOBS: 8
        run: |
          ls -l "$HALIDE_ROOT/lib" | head
          bash tools/generate-halide-aot-android.sh
          ls -l build/halide-android-arm64 | head -20

      - name: android codecs
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/src/build/android-deps
        run: |
          bash tools/build-android-codecs.sh
          ls -l build/android-deps/arm64/lib | head -20

      - name: libfotufilm.so
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          HALIDE_ROOT: ${{ github.workspace }}/src/build/halide-linux-install
          FOTUFILM_ANDROID_DEPS: ${{ github.workspace }}/src/build/android-deps
        run: |
          bash tools/build-android-engine.sh
          find flutter/build/android-engine -name '*.so' -exec ls -l {} \;

      - name: collect
        run: |
          set -e
          mkdir -p out
          cp -a src/flutter/build/android-engine/. out/
          du -sh out
          find out -name '*.so' -exec ls -l {} \;
          cd out && zip -qry ../fotufilm-android-engine.zip .
          ls -l ../fotufilm-android-engine.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fotufilm-android-engine
          path: fotufilm-android-engine.zip
          retention-days: 30
